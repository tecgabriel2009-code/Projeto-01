plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gestaoindustrial.arcasabo'
    compileSdk 34

    defaultConfig {
        applicationId "com.gestaoindustrial.arcasabo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
}

// Tarefas para sincronizar automaticamente a build web nos assets do APK
tasks.register('syncWebAssets', Copy) {
    from("${rootProject.projectDir}/dist")
    into("${projectDir}/src/main/assets/public")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('syncWebAssetsRoot', Copy) {
    from("${rootProject.projectDir}/dist")
    into("${projectDir}/src/main/assets")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

preBuild.dependsOn syncWebAssets
preBuild.dependsOn syncWebAssetsRoot
